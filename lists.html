<header class="site-header"><div class="site-header-inner"><a class="site-logo" href="index.html">SAIGON STAYS<small>HO CHI MINH TRAVEL GUIDE</small></a><nav class="site-nav" aria-label="主選單"><a href="index.html">首頁</a><a href="lists.html" aria-current="page">列表</a><a href="itinerary.html">每日行程</a><a href="attractions.html">景點</a><a href="food.html">美食</a><a href="shopping.html">體驗購物</a><a href="transport.html">住宿交通</a><a href="tips.html">注意事項</a></nav></div></header>

<div class="grid listPageGrid"><section class="panel listsPanel" id="lists"><div class="head"><div><div class="kicker">MY LISTS</div><h2>列表 <span class="headingEn">/ Lists</span></h2></div><a href="index.html">回到首頁 →</a></div><div class="listsApp"><aside class="listsSidebar"><div class="listProgressCard"><div class="listProgressTop"><strong id="listProgress">0%</strong><span>目前清單</span></div><div class="listProgressTrack"><span id="listProgressBar"></span></div><small id="listProgressText">0 / 0 已完成</small></div><div class="listsSectionLabel">清單</div><div class="listNav" id="listNav"></div><button class="addListButton" id="showListForm" type="button">＋ 新增清單</button><form class="newListForm" id="newListForm" hidden><input id="newListName" type="text" maxlength="24" placeholder="清單名稱" autocomplete="off"><div><button type="submit">建立</button><button class="formCancel" id="cancelListForm" type="button">取消</button></div></form></aside><div class="listMain"><div class="undoNotice" id="undoNotice" role="status" aria-live="polite" hidden><span id="undoMessage"></span><button id="undoDelete" type="button">復原</button></div><div class="listMainHead"><div class="listTitleArea"><div class="listTitleLine"><strong id="activeListTitle">打包清單</strong><span class="listCount" id="activeListCount">0 項</span><button class="listRenameButton" id="showRenameForm" type="button">修改名稱</button></div><form class="renameListForm" id="renameListForm" hidden><input id="renameListName" type="text" maxlength="24" aria-label="清單名稱"><button type="submit">儲存</button><button class="renameCancel" id="cancelRenameForm" type="button">取消</button></form></div><div class="listFilters" id="listFilters" role="tablist" aria-label="待辦篩選"><button type="button" data-filter="all">全部</button><button type="button" data-filter="open">未完成</button><button type="button" data-filter="done">已完成</button></div></div><div class="taskList" id="taskList" aria-live="polite"></div><form class="addTaskForm" id="addTaskForm"><input id="newTaskTitle" type="text" maxlength="80" placeholder="新增一項待辦…" autocomplete="off" required><select id="newTaskPriority" aria-label="待辦優先級"><option value="normal">一般</option><option value="high">重要</option><option value="low">低優先</option></select><button type="submit">新增待辦</button></form></div></div></section></div>

<script src="saigon-lists-store.js?v=7"></script>
<script src="saigon-sync.js?v=7"></script>
<script>
(function(){
  const store=window.SaigonListsStore;
  const sync=window.SaigonSync;
  if(!store)return;
  const nav=document.querySelector("#listNav"),taskList=document.querySelector("#taskList");
  const titleEl=document.querySelector("#activeListTitle"),countEl=document.querySelector("#activeListCount");
  const progressEl=document.querySelector("#listProgress"),progressBar=document.querySelector("#listProgressBar"),progressText=document.querySelector("#listProgressText");
  const taskInput=document.querySelector("#newTaskTitle"),priorityInput=document.querySelector("#newTaskPriority");
  const newListForm=document.querySelector("#newListForm"),newListInput=document.querySelector("#newListName");
  const renameForm=document.querySelector("#renameListForm"),renameInput=document.querySelector("#renameListName");
  const undoNotice=document.querySelector("#undoNotice"),undoMessage=document.querySelector("#undoMessage"),undoButton=document.querySelector("#undoDelete");
  if(!nav||!taskList)return;
  let editingTaskId=null;
  let undoTimer=null,undoState=null;
  let state=sync.getState();
  const profileSwitcher=document.querySelector(".profileSwitcher");
  function renderProfile(){
    const id=store.currentProfileId?store.currentProfileId():"johnson";
    if(profileSwitcher)profileSwitcher.querySelectorAll("button[data-profile]").forEach(function(button){
      const active=button.dataset.profile===id;
      button.classList.toggle("active",active);
      button.setAttribute("aria-pressed",active?"true":"false");
    });
  }
  profileSwitcher&&profileSwitcher.addEventListener("click",function(event){
    const button=event.target.closest("button[data-profile]");
    if(!button||button.getAttribute("aria-pressed")==="true")return;
    state=sync.switchProfile(button.dataset.profile);editingTaskId=null;clearUndo();renderProfile();render();
  });
  const statusButton=document.querySelector("#syncStatus"),dialog=document.querySelector("#syncDialog"),statusText=statusButton&&statusButton.querySelector("span");
  const tokenInput=document.querySelector("#syncTokenInput"),syncError=document.querySelector("#syncError"),syncPrimary=document.querySelector("#syncPrimary"),syncCopy=document.querySelector("#syncCopy"),syncClear=document.querySelector("#syncClear");
  function showSyncStatus(next){const label={synced:"已同步",local:"僅本機",offline:"離線"}[next]||"僅本機";if(statusText)statusText.textContent=label;if(statusButton)statusButton.className="syncStatus "+next;}
  function syncDialog(){const linked=!!sync.getToken();document.querySelector("#syncDialogText").textContent=linked?(sync.getMode()==="offline"?"目前無法連線，先使用本機快取；恢復網路後會繼續同步。":"這個分享連結可以在其他裝置開啟同一份清單。"):"沒有分享碼時，資料只會保存在這台裝置。";tokenInput.hidden=linked;syncPrimary.hidden=linked;syncCopy.hidden=!linked;syncClear.hidden=!linked;syncError.textContent="";if(linked)tokenInput.value=sync.buildShareUrl();dialog.hidden=false;}
  statusButton&&statusButton.addEventListener("click",syncDialog);document.querySelector("#syncClose").addEventListener("click",()=>{dialog.hidden=true});
  syncPrimary&&syncPrimary.addEventListener("click",async()=>{let value=tokenInput.value.trim();try{if(value.includes("?t="))value=new URL(value).searchParams.get("t")||"";}catch(error){}syncError.textContent="驗證中…";if(!await sync.setToken(value))syncError.textContent="分享碼無效或目前無法連線，已保留本機資料。";else{dialog.hidden=true;state=sync.getState();render();}});
  syncCopy&&syncCopy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(sync.buildShareUrl());syncError.textContent="已複製分享連結";}catch(error){syncError.textContent="複製失敗，請手動複製上方連結。";}});
  syncClear&&syncClear.addEventListener("click",()=>{if(confirm("解除連結後，這台裝置仍保留目前本機資料，但不再同步。確定嗎？")){sync.clearToken();dialog.hidden=true;showSyncStatus("local");}});
  function showSyncError(message){if(undoTimer)clearTimeout(undoTimer);undoState=null;undoButton.hidden=true;undoMessage.textContent="同步失敗："+(message||"已回到真實狀態");undoNotice.hidden=false;undoTimer=setTimeout(clearUndo,5000);}
  function after(operation){return Promise.resolve(operation).catch(function(error){if(syncError)syncError.textContent=error.message||"同步失敗，已回到本機狀態。";showSyncError(error.message);return null;});}
  function activeList(){let list=state.lists.find(item=>item.id===state.activeListId);if(!list){list=state.lists[0];if(list)state.activeListId=list.id;}return list||null;}
  function field(name,value){const option=document.createElement("option");option.value=value;option.textContent=name;return option;}
  function editForm(task){
    const form=document.createElement("form");form.className="taskEditForm";form.dataset.editId=task.id;
    const input=document.createElement("input");input.name="title";input.maxLength=80;input.required=true;input.value=task.title;input.setAttribute("aria-label","待辦名稱");
    const select=document.createElement("select");select.name="priority";select.setAttribute("aria-label","待辦優先級");
    [["一般","normal"],["重要","high"],["低優先","low"]].forEach(([name,value])=>{const option=field(name,value);option.selected=value===task.priority;select.appendChild(option);});
    const saveButton=document.createElement("button");saveButton.type="submit";saveButton.textContent="儲存";
    const cancelButton=document.createElement("button");cancelButton.type="button";cancelButton.className="taskEditCancel";cancelButton.dataset.cancelEdit=task.id;cancelButton.textContent="取消";
    form.append(input,select,saveButton,cancelButton);return form;
  }
  function clearUndo(){
    if(undoTimer){clearTimeout(undoTimer);undoTimer=null;}
    undoState=null;
    if(undoButton)undoButton.hidden=false;
    if(undoNotice)undoNotice.hidden=true;
  }
  function showUndo(task,index,listId){
    if(undoTimer)clearTimeout(undoTimer);
    undoState={task,index,listId};
    undoButton.hidden=false;
    undoMessage.textContent="已刪除「"+task.title+"」";
    undoNotice.hidden=false;
    undoTimer=setTimeout(clearUndo,5000);
  }
  function render(){
    const list=activeList();
    const addForm=document.querySelector("#addTaskForm");
    const setFormEnabled=enabled=>{if(addForm)addForm.querySelectorAll("input,select,button").forEach(el=>{el.disabled=!enabled;});};
    if(!list){
      // 零清單狀態：使用者刻意刪光所有清單，不要擅自重建預設清單
      progressEl.textContent="0%";progressBar.style.width="0%";progressText.textContent="0 / 0 已完成";
      titleEl.textContent="還沒有清單";countEl.textContent="0 項";
      nav.innerHTML="";taskList.innerHTML="";
      const empty=document.createElement("div");empty.className="taskEmpty";
      empty.textContent="還沒有任何清單。按左邊的「＋ 新增清單」建立第一個吧。";
      taskList.appendChild(empty);
      setFormEnabled(false);
      document.querySelectorAll("#listFilters button").forEach(button=>button.classList.remove("active"));
      return;
    }
    setFormEnabled(true);
    const stats=store.progress(list);
    progressEl.textContent=stats.percent+"%";progressBar.style.width=stats.percent+"%";progressText.textContent=stats.done+" / "+stats.total+" 已完成";
    titleEl.textContent=list.name;countEl.textContent=list.tasks.length+" 項";
    nav.innerHTML="";
    state.lists.forEach(item=>{
      const button=document.createElement("button");button.type="button";button.dataset.listId=item.id;
      button.className=item.id===state.activeListId?"active":"";
      const name=document.createElement("span");name.className="listNavName";name.textContent=item.name;
      const count=document.createElement("span");count.textContent=item.tasks.length;
      button.append(name);
      const mine=item.owner===store.currentProfileId()||item.owner==="shared";
      if(!mine&&item.owner){
        const badge=document.createElement("span");badge.className="listNavOwner";
        badge.textContent=store.profileInfo(item.owner).name;button.append(badge);
      }
      button.append(count);nav.appendChild(button);
    });
    document.querySelectorAll("#listFilters button").forEach(button=>button.classList.toggle("active",button.dataset.filter===state.filter));
    taskList.innerHTML="";
    const filtered=store.sortByPriority(list.tasks.filter(task=>state.filter==="done"?task.done:state.filter==="open"?!task.done:true));
    if(!filtered.length){const empty=document.createElement("div");empty.className="taskEmpty";empty.textContent=state.filter==="done"?"目前沒有已完成待辦":state.filter==="open"?"太好了，這份清單已完成。":"這份清單還沒有待辦，先新增一項吧。";taskList.appendChild(empty);return;}
    filtered.forEach(task=>{
      const row=document.createElement("div");row.className="taskRow"+(task.done?" done":"");
      const grip=document.createElement("span");grip.className="taskGrip";grip.textContent="⋮⋮";
      const checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.className="taskCheck";checkbox.checked=!!task.done;checkbox.dataset.taskId=task.id;checkbox.setAttribute("aria-label","完成 "+task.title);
      const remove=document.createElement("button");remove.type="button";remove.className="taskDelete";remove.dataset.deleteId=task.id;remove.setAttribute("aria-label","刪除 "+task.title);remove.textContent="×";
      if(editingTaskId===task.id){row.append(grip,checkbox,editForm(task),remove);}else{
        const body=document.createElement("div");body.className="taskBody";const taskTitle=document.createElement("span");taskTitle.className="taskTitle";taskTitle.textContent=task.title;body.appendChild(taskTitle);
        const priority=document.createElement("span");priority.className="taskPriority "+task.priority;priority.textContent=store.priorityText(task.priority);
        const edit=document.createElement("button");edit.type="button";edit.className="taskEditButton";edit.dataset.editId=task.id;edit.setAttribute("aria-label","修改 "+task.title);edit.textContent="修改";
        row.append(grip,checkbox,body,priority,edit,remove);
      }
      taskList.appendChild(row);
    });
  }
  nav.addEventListener("click",event=>{const button=event.target.closest("button[data-list-id]");if(!button)return;state.activeListId=button.dataset.listId;state.filter="all";editingTaskId=null;clearUndo();state=store.save(state);render();});
  document.querySelector("#listFilters").addEventListener("click",event=>{const button=event.target.closest("button[data-filter]");if(!button)return;state.filter=button.dataset.filter;editingTaskId=null;render();});
  taskList.addEventListener("change",event=>{if(!event.target.matches(".taskCheck"))return;const task=activeList().tasks.find(item=>item.id===event.target.dataset.taskId);if(!task)return;after(sync.updateTask(task.id,{done:event.target.checked}));});
  taskList.addEventListener("click",event=>{
    const edit=event.target.closest("button[data-edit-id]");if(edit){editingTaskId=edit.dataset.editId;render();const input=taskList.querySelector(".taskEditForm input");if(input){input.focus();input.select();}return;}
    const cancel=event.target.closest("button[data-cancel-edit]");if(cancel){editingTaskId=null;render();return;}
    const remove=event.target.closest("button[data-delete-id]");if(!remove)return;const list=activeList(),index=list.tasks.findIndex(task=>task.id===remove.dataset.deleteId);if(index<0)return;const task=list.tasks[index];after(sync.deleteTask(task.id));editingTaskId=null;showUndo(task,index,list.id);
  });
  undoButton.addEventListener("click",()=>{if(!undoState)return;const recovery=undoState;const list=state.lists.find(item=>item.id===recovery.listId);if(!list||state.activeListId!==recovery.listId){clearUndo();return;}after(sync.addTask(recovery.listId,{title:recovery.task.title,priority:recovery.task.priority}));clearUndo();});
  taskList.addEventListener("submit",event=>{const form=event.target.closest(".taskEditForm");if(!form)return;event.preventDefault();const title=new FormData(form).get("title").trim(),priority=new FormData(form).get("priority"),task=activeList().tasks.find(item=>item.id===form.dataset.editId);if(!task||!title)return;editingTaskId=null;after(sync.updateTask(task.id,{title,priority}));});
  document.querySelector("#addTaskForm").addEventListener("submit",event=>{event.preventDefault();const value=taskInput.value.trim(),list=activeList();if(!value||!list)return;after(sync.addTask(list.id,{title:value,priority:priorityInput.value}));taskInput.value="";taskInput.focus();});
  document.querySelector("#showListForm").addEventListener("click",()=>{newListForm.hidden=false;newListInput.focus();});
  document.querySelector("#cancelListForm").addEventListener("click",()=>{newListForm.hidden=true;newListInput.value="";});
  newListForm.addEventListener("submit",event=>{event.preventDefault();const value=newListInput.value.trim();if(!value)return;after(sync.addList(value));newListInput.value="";newListForm.hidden=true;taskInput.focus();});
  document.querySelector("#showRenameForm").addEventListener("click",()=>{const list=activeList();if(!list)return;renameInput.value=list.name;renameForm.hidden=false;renameInput.focus();renameInput.select();});
  document.querySelector("#cancelRenameForm").addEventListener("click",()=>{renameForm.hidden=true;});
  renameForm.addEventListener("submit",event=>{event.preventDefault();const list=activeList();if(!list)return;const value=renameInput.value.trim();if(!value)return;renameForm.hidden=true;after(sync.renameList(list.id,value));});
  function syncFromStorage(){state=sync.getState();editingTaskId=null;renameForm.hidden=true;render();}
  window.addEventListener("storage",event=>{if(event.key===store.storageKey||event.key===store.legacyKey||event.key===store.profileStorageKey)syncFromStorage();});
  window.addEventListener("pageshow",syncFromStorage);
  window.addEventListener("focus",syncFromStorage);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync.refresh().catch(function(){});});
  sync.init({onChange:function(next){state=next;renderProfile();render();},onStatus:showSyncStatus});
  renderProfile();
  render();
})();
</script>
</body></html>
