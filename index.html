<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胡志明住宿精選｜2026.10.26–30</title>
<meta name="description" content="8 間已篩選的胡志明住宿：價格、地段、評價與實拍照片一次比較。">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#F6F4F0; --card:#FFFFFF; --ink:#171614; --ink2:#3A3833; --muted:#7C776E;
  --line:#E4DFD6; --line2:#CFC9BD; --accent:#2C5340; --accent-soft:#E9EFE9;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Hiragino Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:Georgia,"Times New Roman","Songti TC","Source Han Serif TC",serif;
  --maxw:1100px; --r:3px;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.72;text-wrap:pretty;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,244,240,.92);
  border-bottom:1px solid var(--line);backdrop-filter:saturate(120%) blur(6px)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:58px;padding-top:8px;padding-bottom:8px}
.brand{font-weight:600;letter-spacing:.01em}
.brand .dot{color:var(--muted);margin:0 6px}
.brand em{font-style:normal;color:var(--muted);font-weight:400}
.trip{font-size:12.5px;color:var(--muted);letter-spacing:.02em;text-align:right}
.trip b{color:var(--ink);font-weight:600;font-family:var(--serif)}

/* hero */
.hero{padding-top:64px;padding-bottom:8px}
.eyebrow{font-family:var(--serif);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);margin:0 0 22px}
h1{font-size:clamp(28px,4.6vw,46px);line-height:1.24;letter-spacing:-.02em;margin:0 0 30px;font-weight:700;max-width:760px}
h1 span{color:var(--muted);font-weight:400}
.lede{margin:0;color:var(--ink2);font-size:14.5px;max-width:62ch}
.lede b{font-weight:600}

/* overview table */
.overview{margin-top:52px;border-top:1px solid var(--line2)}
.overview h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:0;padding:18px 0 14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 14px 11px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;
  border-bottom-color:var(--line2)}
td.r,th.r{text-align:right;padding-right:0}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--card)}
tbody td:first-child{color:var(--muted);font-family:var(--serif)}
tbody td.p{font-family:var(--serif);font-size:15px;white-space:nowrap}
tbody td.p .unit{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-left:3px}
tbody td.n{white-space:nowrap;color:var(--muted)}
.tnote{color:var(--muted);font-size:12.5px;margin:14px 0 0;padding-bottom:4px}

/* toolbar */
.toolbar{position:sticky;top:58px;z-index:20;background:rgba(246,244,240,.94);
  border-bottom:1px solid var(--line);margin-top:36px;backdrop-filter:saturate(120%) blur(6px)}
.toolbar .wrap{display:flex;align-items:center;gap:18px;justify-content:space-between;
  padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--ink2);
  transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--ink)}
.chip .c{color:var(--muted);font-size:11px;margin-left:5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] .c{color:rgba(255,255,255,.6)}
.sortbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sortbox select{font:inherit;font-size:12.5px;color:var(--ink);background:none;border:0;
  border-bottom:1px solid var(--line2);padding:3px 2px;cursor:pointer;border-radius:0}
.sortbox select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* list */
.list{list-style:none;margin:0;padding-top:0;padding-bottom:0}
@keyframes listIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.list.fade{animation:listIn .22s ease}
.row{border-bottom:1px solid var(--line);padding:30px 0;display:grid;
  grid-template-columns:44px minmax(230px,340px) 1fr;gap:28px;align-items:start;cursor:pointer}
.row:hover .title{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
@media (hover:hover) and (pointer:fine){
  .row{transition:background .18s ease,box-shadow .18s ease;border-radius:var(--r)}
  .row:hover{background:var(--card);box-shadow:0 7px 22px -15px rgba(23,22,20,.3)}
  .row:hover .shot img{transform:scale(1.015)}
  .shot img{transition:transform .3s ease}
}
.idx{font-family:var(--serif);font-size:13px;color:var(--muted);padding-top:3px}
.shot{position:relative;background:#EAE7E1;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3}
.shot img{width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.shot .count{position:absolute;left:10px;top:10px;background:rgba(23,22,20,.62);color:#fff;
  font-size:11px;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.shot .navs{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;opacity:0;transition:opacity .18s}
.row:hover .shot .navs,.shot:focus-within .navs{opacity:1}
.shot .navs button{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);
  border:1px solid var(--line2);line-height:1;font-size:13px;color:var(--ink)}
.shot .navs button:hover{background:#fff}
.body{min-width:0}
.title{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:2px 0 4px;display:inline-block}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.sub .sep{margin:0 7px;color:var(--line2)}
.facts{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.price{font-family:var(--serif);font-size:23px;letter-spacing:-.01em}
.price .cur{font-size:13px;color:var(--muted);margin-right:4px}
.price .unit{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:6px}
.price .was{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:10px;text-decoration:line-through}
.rating{font-size:13px;color:var(--ink2)}
.rating b{font-family:var(--serif);font-size:15px}
.rating.tbd{color:var(--muted)}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:11.5px;color:var(--muted);background:var(--accent-soft);border-radius:2px;padding:2px 8px}
.peek{margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--ink2)}
.peek li{display:flex;gap:9px;margin-bottom:3px}
.peek .m{color:var(--accent);flex:0 0 auto}
.peek .m.neg{color:var(--muted)}
.peek li.neg{color:var(--muted)}
.more{margin-top:16px;font-size:13px;color:var(--accent);border-bottom:1px solid currentColor;
  padding-bottom:1px;display:inline-block}
.empty{padding:70px 0;text-align:center;color:var(--muted)}

footer{margin-top:70px;border-top:1px solid var(--line);padding:26px 0 70px;font-size:12.5px;color:var(--muted)}
footer p{margin:0 0 6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(23,22,20,.42);z-index:60;opacity:0;
  transition:opacity .22s ease}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:61;inset:0;overflow-y:auto;padding:0 20px 60px;
  display:flex;justify-content:center;align-items:flex-start}
.panel{background:var(--card);border-radius:4px;width:100%;max-width:760px;margin-top:34px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.35);transform:translateY(10px);
  transition:transform .22s ease;position:relative}
.panel.on{transform:none}
.phead{position:sticky;top:0;background:var(--card);z-index:2;display:flex;gap:16px;
  align-items:flex-start;justify-content:space-between;padding:22px 26px 14px;border-bottom:1px solid var(--line)}
.phead h3{margin:0 0 7px;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.phead p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.pclose{width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;flex:0 0 auto;
  line-height:1;font-size:16px;color:var(--ink2)}
.pclose:hover{background:var(--paper)}
.gal{padding:18px 26px 0}
.gal-main{aspect-ratio:16/10;background:#EAE7E1;border-radius:var(--r);overflow:hidden;position:relative;cursor:zoom-in}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-main .lab{position:absolute;left:12px;bottom:12px;background:rgba(23,22,20,.62);color:#fff;
  font-size:11.5px;padding:3px 9px;border-radius:2px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 0;scrollbar-width:thin}
.thumbs img{width:74px;height:56px;object-fit:cover;border-radius:2px;flex:0 0 auto;
  opacity:.62;transition:opacity .15s;cursor:pointer;border:1px solid transparent}
.thumbs img:hover{opacity:.9}
.thumbs img.on{opacity:1;border-color:var(--ink)}
.sect{padding:24px 26px 0}
.sect:last-of-type{padding-bottom:6px}
h4{margin:0 0 12px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dl{display:grid;grid-template-columns:88px 1fr;gap:8px 16px;margin:0;font-size:13.5px}
.dl dt{color:var(--muted);font-size:12.5px}
.dl dd{margin:0;color:var(--ink2)}
.bd{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
.bd b{font-family:var(--serif);font-size:14px;margin-left:5px}
ul.pl{list-style:none;margin:0;padding:0;font-size:14px;color:var(--ink2)}
ul.pl li{display:flex;gap:10px;margin-bottom:7px}
ul.pl .m{color:var(--accent);flex:0 0 auto}
ul.pl.neg .m{color:var(--muted)}
.summary{font-size:14.5px;color:var(--ink);margin:0;background:var(--paper);border-radius:var(--r);
  padding:16px 18px}
.links{display:flex;gap:20px;flex-wrap:wrap;padding:24px 26px 30px;font-size:13.5px}
.links a{color:var(--accent);border-bottom:1px solid currentColor;text-decoration:none;padding-bottom:1px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(15,14,13,.94);display:flex;
  align-items:center;justify-content:center;padding:40px 24px}
.lb img{max-width:min(1200px,92vw);max-height:84vh;object-fit:contain;border-radius:2px}
.lb button{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.12);color:#fff;font-size:18px;line-height:1}
.lb button:hover{background:rgba(255,255,255,.24)}
.lb .prev{left:18px}.lb .next{right:18px}
.lb .x{top:18px;right:18px;transform:none}
.lb .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:12.5px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@media (max-width:860px){
  .overview{display:none}
  .wrap{padding-left:28px;padding-right:28px}
  .row{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:30px 0}
  .idx{display:none}
  .body{display:contents}
  .title{order:1;align-self:flex-start;margin:0 0 6px}
  .sub{order:2;align-self:flex-start;margin:0 0 14px}
  .shot{order:3;margin:0 0 20px}
  .facts{order:4}
  .tags{order:5}
  .peek{order:6}
  .more{order:7;align-self:flex-start}
  .hero{padding-top:40px}
  .topbar{position:static}
  .toolbar{position:sticky;top:0;z-index:20;margin-top:28px;background:rgba(246,244,240,.97)}
  .toolbar .wrap{flex-wrap:wrap;gap:8px;padding-top:10px;padding-bottom:10px}
  .chips{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto}
  .sortbox{flex:0 0 auto}
  .panel{max-width:640px}
  .gal{padding:18px 20px 0}
  .sect{padding:24px 20px 0}
  .links{padding:24px 20px 30px}
  .phead{padding:22px 20px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">胡志明住宿精選<span class="dot">·</span><em>8 間</em></div>
    <div class="trip"><b>2026.10.26 – 10.30</b>　4 晚 · 2 人</div>
  </div>
</header>

<main>
  <section class="wrap hero">
    <p class="eyebrow">Saigon stays · 已篩選</p>
    <h1>八間住宿，<br><span>按價格、地段與作息挑。</span></h1>
    <p class="lede">價格是 <b>2026/10/26–30 共 4 晚、2 位客人</b>的優惠價（RM）。評分取自各房源頁面；標註<b>「新上線」</b>的房源評價樣本極少，僅供初步參考。點任一住宿可看完整資訊與實拍照片。</p>
  </section>

  <section class="wrap overview" aria-label="一覽表">
    <h2>一覽</h2>
    <table>
      <thead><tr><th>#</th><th>住宿</th><th>區域</th><th class="r">4 晚價</th><th class="r">評分</th><th>一句話</th></tr></thead>
      <tbody id="ovbody"></tbody>
    </table>
    <p class="tnote">「—」表示筆記未記錄價格。價格皆為 4 晚總額、2 人入住。</p>
  </section>

  <div class="toolbar">
    <div class="wrap">
      <div class="chips" id="chips" role="group" aria-label="篩選"></div>
      <label class="sortbox">排序
        <select id="sort">
          <option value="idx">預設（筆記順序）</option>
          <option value="price-asc">價格：低 → 高</option>
          <option value="price-desc">價格：高 → 低</option>
          <option value="rating">評分：高 → 低</option>
        </select>
      </label>
    </div>
  </div>

  <ol class="list wrap" id="list"></ol>
</main>

<footer class="wrap">
  <p>資料整理於 2026/09/11，價格與空房狀態會變動，訂房前請以房源頁面為準。</p>
  <p>照片來源：Airbnb 房源頁（8 間）。</p>
</footer>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden aria-hidden="true">
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle"></div>
</div>
<div class="lb" id="lb" hidden></div>

<script>
const DATA = [{"slug": "s12", "name": "Centoria Hotel By Urban B", "sub": "3 星級・Go Vap 區・設施新", "badge": "新加入", "area": "Go Vap 區", "areaNote": "安靜住宅區，離市中心較遠", "type": "飯店・3 星級", "price": 326, "priceNote": "", "rating": "9.5", "ratingCount": "24 則", "ratingNote": "優異（員工 9.6・位置 9.2）", "host": "Booking.com・Urban B 系列", "roomType": "雙人房｜冰箱、迷你吧、電熱水壺、書桌", "stay": "入住 14:00 後｜退房 12:00 前", "cancel": "依 Booking 頁面為準", "access": "656/52 Đường Quang Trung, Go Vap 區", "facilities": "免費 WiFi、共用廚房、客房服務、冰箱、迷你吧、電熱水壺、淋浴設施、吹風機、書桌", "breakdown": [["員工素質", "9.6"], ["位置", "9.2"]], "pros": ["評分 9.5（優異），24 條點評中員工素質 9.6 最高", "房客形容「new and refreshing」——房間新穎、乾淨整潔", "員工與經理親切熱心（澳洲、喬治亞、土耳其、越南房客一致提到）", "有共用廚房、冰箱、迷你吧、電熱水壺，長住很方便", "三間中價格最低（RM 326／4 晚）"], "cons": ["位於 Go Vap 區，離第 1 區市中心較遠，需叫車", "點評數僅 24 條，樣本偏少", "3 星級飯店，房間空間預期不大"], "summary": "Urban B 系列中評價最高的一間（9.5，優異），主打新穎乾淨與親切服務，員工素質 9.6。價格 RM 326 是三間最低，適合想住安靜住宅區、需要共用廚房的長住行程；代價是離市中心景點較遠。", "location": "胡志明市 Go Vap 區（656/52 Đường Quang Trung）", "lat": 10.82772, "lng": 106.67848, "src": "https://www.booking.com/hotel/vn/centoria-by-urban-b.zh-tw.html", "tags": ["3星級", "共用廚房", "新穎", "最便宜"], "photos_out": [{"src": "images/s12_01.jpg", "label": "外觀"}, {"src": "images/s12_02.jpg", "label": "房間"}, {"src": "images/s12_03.jpg", "label": "浴室"}, {"src": "images/s12_04.jpg", "label": "房間"}, {"src": "images/s12_05.jpg", "label": "外觀"}, {"src": "images/s12_06.jpg", "label": "大廳"}]}];
const EMBED = {};
const srcOf = p => EMBED[p] || p;
const NF = new Intl.NumberFormat('en-US');

/* ---------- chips ---------- */
const FILTERS = [
  ['全部', () => true],
  ['近機場', s => s.tags.includes('近機場')],
  ['市中心 D1', s => s.tags.includes('市中心 D1')],
  ['有電梯', s => s.tags.includes('電梯')],
  ['投影影院', s => s.tags.includes('投影影院')],
  ['洗衣', s => s.tags.includes('洗衣')],
  ['可帶寵物', s => s.tags.includes('可帶寵物')],
  ['新上線', s => s.tags.includes('新上線')],
];
let active = '全部', sortMode = 'idx';
const chips = document.getElementById('chips');
chips.innerHTML = FILTERS.map(([label], i) =>
  `<button class="chip" data-f="${i}" aria-pressed="${i === 0}">${label}<span class="c">${DATA.filter(FILTERS[i][1]).length}</span></button>`
).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  active = FILTERS[+b.dataset.f][0];
  [...chips.children].forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});
document.getElementById('sort').addEventListener('change', e => { sortMode = e.target.value; render(); });

/* ---------- overview table ---------- */
document.getElementById('ovbody').innerHTML = DATA.map((s, i) => `
  <tr data-i="${i}">
    <td>${String(i + 1).padStart(2, '0')}</td>
    <td>${s.name}</td>
    <td class="n">${s.area}</td>
    <td class="r p">${s.price == null ? '—' : NF.format(s.price) + '<span class="unit">RM</span>'}</td>
    <td class="r n">${s.rating ? s.rating : '—'}</td>
    <td class="n">${s.sub}</td>
  </tr>`).join('');
document.getElementById('ovbody').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (tr) openSheet(+tr.dataset.i);
});

/* ---------- list ---------- */
const list = document.getElementById('list');
function visible() {
  let out = DATA.map((s, i) => ({ s, i })).filter(({ s }) => FILTERS.find(f => f[0] === active)[1](s));
  if (sortMode === 'price-asc')  out.sort((a, b) => (a.s.price ?? 1e9) - (b.s.price ?? 1e9));
  if (sortMode === 'price-desc') out.sort((a, b) => (b.s.price ?? -1) - (a.s.price ?? -1));
  if (sortMode === 'rating')     out.sort((a, b) => (parseFloat(b.s.rating) || 0) - (parseFloat(a.s.rating) || 0));
  return out;
}
function priceHTML(s) {
  if (s.price == null) return `<div class="price"><span class="unit">價格未記錄</span></div>`;
  return `<div class="price"><span class="cur">RM</span>${NF.format(s.price)}<span class="unit">／4 晚 · 2 人</span>` +
         (s.priceNote ? `<span class="was">${s.priceNote}</span>` : '') + `</div>`;
}
function render() {
  const rows = visible();
  if (!rows.length) { list.innerHTML = '<li class="empty">沒有符合條件的住宿</li>'; return; }
  list.innerHTML = rows.map(({ s, i }) => `
    <li class="row" data-i="${i}" data-p="0" tabindex="0" role="button"
        aria-label="${s.name}，查看完整資訊">
      <div class="idx num">${String(i + 1).padStart(2, '0')}</div>
      <div class="shot">
        <img src="${srcOf(s.photos_out[0].src)}" alt="${s.name} ${s.photos_out[0].label}" loading="lazy">
        <span class="count">1 / ${s.photos_out.length}</span>
        ${s.photos_out.length > 1 ? `<span class="navs">
          <button data-nav="-1" aria-label="上一張">‹</button>
          <button data-nav="1" aria-label="下一張">›</button></span>` : ''}
      </div>
      <div class="body">
        <div class="title">${s.name}</div>
        <p class="sub">${s.area}${s.areaNote ? '<span class="sep">|</span>' + s.areaNote : ''}</p>
        <div class="facts">
          ${priceHTML(s)}
          ${s.rating
            ? `<div class="rating">評分 <b>${s.rating}</b>　<span style="color:var(--muted);font-size:12.5px">${s.ratingCount}</span></div>`
            : `<div class="rating tbd">${s.ratingNote}</div>`}
        </div>
        <div class="tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <ul class="peek">
          ${s.pros.slice(0, 2).map(p => `<li><span class="m">＋</span><span>${p}</span></li>`).join('')}
          ${s.cons.slice(0, 1).map(p => `<li class="neg"><span class="m neg">－</span><span>${p}</span></li>`).join('')}
        </ul>
        <span class="more">完整資訊</span>
      </div>
    </li>`).join('');
  list.classList.remove('fade'); void list.offsetWidth; list.classList.add('fade');
}
list.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  const li = e.target.closest('.row'); if (!li) return;
  const s = DATA[+li.dataset.i];
  if (nav) {
    e.stopPropagation();
    let p = (+li.dataset.p + +nav.dataset.nav + s.photos_out.length) % s.photos_out.length;
    li.dataset.p = p;
    li.querySelector('.shot img').src = srcOf(s.photos_out[p].src);
    li.querySelector('.shot .count').textContent = (p + 1) + ' / ' + s.photos_out.length;
    return;
  }
  openSheet(+li.dataset.i);
});
list.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(+e.target.closest('.row').dataset.i); }
});

/* ---------- sheet ---------- */
const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet'),
      panel = document.getElementById('panel');
let lastFocus = null;
function fact(label, value) { return value ? `<dt>${label}</dt><dd>${value}</dd>` : ''; }
function openSheet(i) {
  const s = DATA[i];
  panel.innerHTML = `
    <div class="phead">
      <div>
        <h3 id="ptitle">${s.name}</h3>
        <p>${s.area}　·　${s.sub}</p>
      </div>
      <button class="pclose" aria-label="關閉">✕</button>
    </div>
    <div class="gal">
      <div class="gal-main" id="galMain"><img id="galImg" src="${srcOf(s.photos_out[0].src)}" alt="${s.name}">
        <span class="lab" id="galLab">${s.photos_out[0].label}</span></div>
      <div class="thumbs" id="thumbs">${s.photos_out.map((p, k) =>
        `<img src="${srcOf(p.src)}" data-k="${k}" class="${k === 0 ? 'on' : ''}" alt="${p.label}" loading="lazy">`).join('')}</div>
    </div>
    <div class="sect">
      <h4>基本資料</h4>
      <dl class="dl">
        ${fact('類型', s.type)}
        ${fact('房型', s.roomType)}
        ${fact('房東', s.host)}
        ${s.rating ? fact('評分', `${s.rating}／5（${s.ratingCount}，${s.ratingNote}）`) : fact('評分', s.ratingNote)}
        ${fact('價格', s.price == null ? '價格未記錄' : `RM ${NF.format(s.price)}／4 晚（2 人）${s.priceNote ? '｜' + s.priceNote : ''}`)}
        ${fact('入住／退房', s.stay)}
        ${fact('取消政策', s.cancel)}
        ${fact('位置', s.location)}
        ${fact('交通', s.access)}
        ${fact('設施', s.facilities)}
      </dl>
      ${s.breakdown.length ? `<div class="bd">${s.breakdown.map(([k, v]) => `<span>${k}<b>${v}</b></span>`).join('')}</div>` : ''}
    </div>
    <div class="sect">
      <h4>優點</h4>
      <ul class="pl">${s.pros.map(p => `<li><span class="m">＋</span><span>${p}</span></li>`).join('')}</ul>
    </div>
    <div class="sect">
      <h4>留意</h4>
      <ul class="pl neg">${s.cons.map(p => `<li><span class="m">－</span><span>${p}</span></li>`).join('')}</ul>
    </div>
    <div class="sect">
      <h4>總結</h4>
      <p class="summary">${s.summary}</p>
    </div>
    <div class="links">
      <a href="${s.src}" target="_blank" rel="noopener">房源頁面 ↗</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" rel="noopener">在地圖上開啟 ↗</a>
    </div>`;
  lastFocus = document.activeElement;
  scrim.hidden = false; sheet.hidden = false;
  requestAnimationFrame(() => { scrim.classList.add('on'); panel.classList.add('on'); });
  sheet.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  panel.querySelector('.pclose').focus();
  panel.querySelector('.pclose').addEventListener('click', closeSheet);
  document.getElementById('thumbs').addEventListener('click', e => {
    const im = e.target.closest('img'); if (!im) return;
    setPhoto(s, +im.dataset.k);
  });
  document.getElementById('galMain').addEventListener('click', () => openLB(s, curK));
  sheet.scrollTop = 0;
}
let curK = 0, curS = null;
function setPhoto(s, k) {
  curK = k;
  document.getElementById('galImg').src = srcOf(s.photos_out[k].src);
  document.getElementById('galLab').textContent = s.photos_out[k].label;
  [...document.getElementById('thumbs').children].forEach((el, j) => el.classList.toggle('on', j === k));
}
function closeSheet() {
  scrim.classList.remove('on'); panel.classList.remove('on');
  setTimeout(() => { scrim.hidden = true; sheet.hidden = true; }, 200);
  sheet.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}
scrim.addEventListener('click', closeSheet);

/* ---------- lightbox ---------- */
const lb = document.getElementById('lb');
function openLB(s, k) {
  curS = s; curK = k;
  lb.innerHTML = `<button class="x" aria-label="關閉">✕</button>
    <button class="prev" aria-label="上一張">‹</button>
    <button class="next" aria-label="下一張">›</button>
    <img id="lbImg" src="${srcOf(s.photos_out[k].src)}" alt="${s.name}">
    <span class="cap">${s.name}　·　${s.photos_out[k].label}　（${k + 1} / ${s.photos_out.length}）</span>`;
  lb.hidden = false;
  lb.querySelector('.x').onclick = closeLB;
  lb.querySelector('.prev').onclick = () => lbStep(-1);
  lb.querySelector('.next').onclick = () => lbStep(1);
  lb.onclick = e => { if (e.target === lb) closeLB(); };
}
function lbStep(d) {
  curK = (curK + d + curS.photos_out.length) % curS.photos_out.length;
  document.getElementById('lbImg').src = srcOf(curS.photos_out[curK].src);
  lb.querySelector('.cap').textContent = `${curS.name}　·　${curS.photos_out[curK].label}　（${curK + 1} / ${curS.photos_out.length}）`;
  setPhoto(curS, curK);
}
function closeLB() { lb.hidden = true; lb.innerHTML = ''; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!lb.hidden) closeLB(); else if (!sheet.hidden) closeSheet(); }
  if (!lb.hidden && e.key === 'ArrowLeft') lbStep(-1);
  if (!lb.hidden && e.key === 'ArrowRight') lbStep(1);
});

render();
</script>
</body>
</html>
